name: Scarlet Archive verification
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: scarlet_test
          MYSQL_ROOT_PASSWORD: ci-test-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format, type check and production build
        working-directory: frontend
        run: npm ci && npm run format:check && npm run build
      - name: H2 tests and package
        working-directory: backend
        run: mvn -B verify
      - name: MySQL tests
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/scarlet_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ci-test-only
        run: mvn -B test
      - name: Start application
        working-directory: backend
        run: |
          java -jar target/scarlet-archive-1.0.0.jar --debug=false > app.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8098/api/health && exit 0; sleep 1; done
          cat app.log
          exit 1
      - name: Browser flows
        working-directory: frontend
        env:
          SCARLET_BASE_URL: http://127.0.0.1:8098
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scarlet-verification
          path: |
            docs/screenshots/
            docs/evidence/
            backend/target/surefire-reports/
            backend/app.log
